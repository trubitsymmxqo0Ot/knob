services:
    db:
      image: postgres:16-alpine
      restart: always
      enviroment:
        POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
        POSTGRES_USER: ${POSTGRES_USER}
        POSTGRES_DB: ${POSTGRES_DB}
      healthcheck:
        test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
        interval: 10s
        timeout: 10s
        retries: 5
        volumes: 
          db-data:/var/lib/postgres/data
    server:
  
    client:
