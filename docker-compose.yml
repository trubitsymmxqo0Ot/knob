services:
    db:
        image: postgres:16-alpine
        restart: always
        ports:
            - "5000:5432"
        environment:
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_DB: ${POSTGRES_DB}
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
                ]
            interval: 10s
            timeout: 10s
            retries: 5
            start_period: 30s
        volumes:
            - db-data:/var/lib/postgres/data
        networks:
            - backend
        env_file:
            - .env
    server:
        build: ./server
        ports:
            - "${BACKEND_PORT}:4000"
        depends_on:
            db:
                condition: service_healthy
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "wget -q --spider http://localhost:4000/health || exit 1",
                ]
            interval: 10s
            timeout: 10s
            retries: 5
            start_period: 30s
        environment:
            BACKEND_PORT: ${BACKEND_PORT}
        networks:
            - frontend
            - backend
        env_file:
            - .env
    client:
        build: ./client
        ports:
            - "3000:5173"
        depends_on:
            server:
                condition: service_healthy
        networks:
            - frontend
networks:
    frontend:
    backend:
volumes:
    db-data:
